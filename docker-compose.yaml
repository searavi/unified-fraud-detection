services:
  aerospike-db:
    image: aerospike/aerospike-server-enterprise:8.0.0.7
    container_name: aerospike-db
    volumes:
      - ./config/aerospike.conf:/etc/aerospike/aerospike.conf
    healthcheck:
      test: ["CMD", "asinfo", "-p", "3000", "-v", "build"]
      interval: 5s
      timeout: 20s
      retries: 4
    networks:
      - asgraph_net
    ports:
      - "3000-3002:3000-3002"
  aerospike-graph-service:
    image: aerospike/aerospike-graph-service:3.0.0
    container_name: asgraph-service
    depends_on:
      aerospike-db:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      - aerospike.client.namespace=test
      - aerospike.client.host=aerospike-db
      - aerospike.graph.index.vertex.label.enabled=true
      - aerospike.graph.query-tracing.threshold-ms=5
      - aerospike.graph.query-tracing.opentelemetry-host=zipkin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 4
    networks:
      - asgraph_net
    ports:
      - "8182:8182"
      - "9090:9090"
  zipkin:
    image: openzipkin/zipkin
    container_name: asgraph-zipkin
    networks:
      - asgraph_net
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 5s
      timeout: 10s
      retries: 4
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: asgraph-ollama
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - asgraph_net
  #   ports:
  #     - "11434:11434"
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list || exit 0"]
  #     interval: 10s
  #     timeout: 30s
  #     retries: 5
  #     start_period: 30s
  #   deploy:
  #     resources:
  #       reservations:
  #         memory: 4G
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: "asgraph-backend"
    depends_on:
      aerospike-db:
        condition: service_healthy
      aerospike-graph-service:
        condition: service_healthy
    environment:
      - AEROSPIKE_HOST=aerospike-db
      - AEROSPIKE_KV_PORT=3000
      # Mesh runs standalone via Mesh/scripts/test-container-locally.ps1 on the
      # meshruntime-local-net network, reachable here via the `meshruntime` alias.
      - MESH_BASE_URL=http://meshruntime:8080
      # LLM Provider: "gemini" or "ollama"
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      # Gemini settings (used when LLM_PROVIDER=gemini)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      # Local dev only: lets the "Enable Workflow Execution" recovery action flip Mesh's
      # file-mount OPA sidecar to permissive_mode directly, since that OPA reads this file once
      # at container start and never polls Mesh's policy API (no bundle-service config there).
      - OPA_POLICY_FILE=/opa-policies/data.json
      - OPA_CONTAINER_NAME=opa-sidecar-local-test
    volumes:
      - ./data:/data
      - ../Mesh/deployment/opa/policies:/opa-policies
      # Grants this container control of the host's Docker daemon (equivalent to root on the
      # host) so it can restart the OPA sidecar after editing its policy file above — local dev
      # convenience only, never do this in a real deployment.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:4000/health"]
      interval: 5s
      timeout: 10s
      retries: 4
      start_period: 45s
    networks:
      - asgraph_net
      - meshruntime-local-net
    ports:
      - "4000:4000"
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: "asgraph-frontend"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://asgraph-backend:4000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    networks:
      - asgraph_net
    ports:
      - "8081:8080"
  generator:
    build:
      context: .
      dockerfile: generator.Dockerfile
    container_name: "asgraph-generator"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asgraph_net
    ports:
      - "4001:4001"
  synktron-agent-service:
    build:
      context: ..
      # Points at Agent-mongo-fraud-agents (this session's active work, PR #106), not the
      # sibling checkout literally named "Agent" (an unrelated, never-PR'd branch) — see
      # docker/agent-service.local.Dockerfile's own header for why this isn't the real Dockerfile
      # path directly.
      dockerfile: unified-fraud-detection-mongo/docker/agent-service.local.Dockerfile
    container_name: synktron-agent-service
    depends_on:
      aerospike-db:
        condition: service_healthy
    environment:
      - AEROSPIKE_HOST=aerospike-db
      - AEROSPIKE_KV_PORT=3000
      - AEROSPIKE_NAMESPACE=test
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      # Required for the /invoke route's invocation-token exchange (mesh_invocation_auth.py) —
      # matches the backend's own MESH_BASE_URL convention below for this same local network.
      - MESHAUTH__ENDPOINTURL=http://meshruntime:8080
      - PYTHONPATH=/app/src:/app/src/Synktron/AgentFramework/Python/Agents
    command: ["uvicorn", "Synktron.AgentFramework.Python.Service.main:app", "--host", "0.0.0.0", "--port", "8090"]
    networks:
      asgraph_net:
        aliases:
          - synktron-aerospike-agents
    ports:
      - "8000:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Mesh is run standalone via Mesh/scripts/test-container-locally.ps1, not built here.
  # That script starts its own OPA sidecar, local auth signing keys, and Mongo/Azurite deps,
  # and publishes the container on the external `meshruntime-local-net` network (alias `meshruntime`)
  # joined by the `backend` service below. Run it before `docker compose up`.

  # Monitoring Stack
  aerospike-exporter:
    image: aerospike/aerospike-prometheus-exporter:latest
    container_name: aerospike-exporter
    depends_on:
      aerospike-db:
        condition: service_healthy
    environment:
      - AS_HOST=aerospike-db
      - AS_PORT=3000
    networks:
      - asgraph_net
    ports:
      - "9145:9145"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - aerospike-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - asgraph_net
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards/custom
      - ./monitoring/dashboards:/var/lib/grafana/dashboards/aerospike
    networks:
      - asgraph_net
    ports:
      - "3030:3000"

networks:
  asgraph_net:
    name: asgraph_net
  # Created by Mesh/scripts/test-container-locally.ps1 (Ensure-LocalNetwork). Run that script
  # before `docker compose up` so this network exists — compose will not create it.
  meshruntime-local-net:
    external: true

volumes:
  ollama_data:
  agent_mongodb_data:
  prometheus_data:
  grafana_data:
